name: code-smells

services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    image: code-smells-db:pg16
    container_name: code-smells-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: code-smells-app:boot4
    container_name: code-smells-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: smells_app
      SPRING_DATASOURCE_PASSWORD: smells_app
      JAVA_OPTS: -XX:MaxRAMPercentage=75
    ports:
      - "8084:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata: