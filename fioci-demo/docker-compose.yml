# fioci-demo — the real backing services behind the simulated AWS catalog.
#
#   docker compose up -d          -> Postgres, Redis, MinIO, DynamoDB Local, LocalStack
#   make start-fioci-demo         -> Spring Boot app on :8095 (probes each service;
#                                    "mode" flips simulated -> live-compose when up)
#
# No AWS account. No cloud spend. Every concept maps 1:1 to a local container.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fioci
      POSTGRES_PASSWORD: fioci
      POSTGRES_DB: fioci
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fioci"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fioci
      MINIO_ROOT_PASSWORD: fioci12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3,sqs,lambda,dynamodb,sts,iam
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  minio-data:
  localstack-data:
