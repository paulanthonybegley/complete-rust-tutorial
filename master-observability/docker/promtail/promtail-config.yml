server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_log_path"]
        target_label: __path__
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      # keep log cardinality sane: drop every other docker container label
      - action: labeldrop
        regex: __meta_docker_container_label_.*
    pipeline_stages:
      # the app logs JSON via logstash-logback-encoder; lift the two fields that let
      # learners write the canonical LogQL queries below.
      - json:
          expressions:
            level: level
            trace_id: mdc.trace_id
      - labels:
          level:
          trace_id: