services:
  db:
    image: postgres:16-alpine
    container_name: dblaws-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dblaws}
      POSTGRES_USER: ${POSTGRES_USER:-dblaws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dblaws}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dblaws} -d ${POSTGRES_DB:-dblaws}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: