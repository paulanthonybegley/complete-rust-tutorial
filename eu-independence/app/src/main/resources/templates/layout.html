<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="${pageTitle != null ? pageTitle + ' · European Independence Lab' : 'European Independence Lab'}">European
		Independence Lab</title>
	<link rel="icon" href="data:," />
	<link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />
	<script th:src="@{/js/htmx.min.js}" src="/js/htmx.min.js" defer></script>
</head>

<body>

<th:block th:fragment="topbar">
	<header class="topbar">
		<a class="brand" th:href="@{/}">
			<span class="brand-star">✦</span> Europe <em>Decoupled</em>
		</a>
		<nav class="nav">
			<a th:href="@{/}">Home</a>
			<a th:href="@{/policies}">Policies</a>
			<a th:href="@{/lab}">Lab</a>
			<a th:href="@{/timeline}">Timeline</a>
			<a th:href="@{/quiz}">Quiz</a>
			<a th:href="@{/flashcards}">Flashcards</a>
			<a th:href="@{/partners}">Partners</a>
			<a th:href="@{/sources}">Sources</a>
		</nav>
	</header>
	<nav class="themes">
		<a th:each="c : ${navCategories}" th:href="@{/policies(cat=${c})}" th:text="${c.label}">Theme</a>
	</nav>
</th:block>

<th:block th:fragment="footer">
	<footer class="footer">
		<p>
			Europe Decoupled — an interactive course from the video
			<a href="https://www.youtube.com/watch?v=ec_4Un6JrAY" target="_blank" rel="noopener">“Von der Leyen’s New Plan
				for European Independence Explained”</a>.
		</p>
		<p class="muted">Built on the OLD.jpg framework: <em>“A lesson plan is a system, not a prompt.”</em> ©
			<span th:text="${currentYear}">2026</span></p>
	</footer>
</th:block>

</body>
</html>
