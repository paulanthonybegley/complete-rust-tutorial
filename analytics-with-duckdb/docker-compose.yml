services:
  duckdb:
    build: .
    container_name: duckdb-analytics
    volumes:
      - ${DUCKDB_DATA:-./data}:/data
    environment:
      DUCKDB_FILE: /data/analytics.duckdb
    healthcheck:
      test: ["CMD", "duckdb", "/data/analytics.duckdb", "-c", "SELECT count(*) FROM orders"]
      interval: 5s
      timeout: 3s
      retries: 5
